name: Live integration

on:
  workflow_dispatch:
    inputs:
      user_agent:
        description: Optional User-Agent to send (defaults to the bundled Chrome UA)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  live-identify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Live identify against Babelio
        env:
          BABELIO_COOKIE: ${{ secrets.BABELIO_COOKIE }}
          BABELIO_UA: ${{ inputs.user_agent }}
        run: uv run pytest tests/test_integration.py --no-cov -v
