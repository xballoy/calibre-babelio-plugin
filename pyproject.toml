[project]
name = "calibre-babelio-plugin"
version = "0.1.0"
description = "Calibre metadata source plugin for Babelio (dev/CI tooling project)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.3",
    "mypy==2.3.1",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.1",
    "html5lib==1.1",
    "babel==2.18.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "BLE", "C90", "PERF", "RUF", "TC"]
# The plugin parses and tests French text; typographic quotes, dashes, and ellipses in
# strings and comments are deliberate.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["calibre_babelio"]
# config.py (Qt UI) and __init__.py (Calibre Source glue) need a running Calibre.
omit = ["*/config.py", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/calibre_babelio", "tests"]

# Calibre/Qt + runtime-only libs are unavailable off-Calibre; stub them out so the
# type checker succeeds without Calibre and treats these imports as untyped.
[[tool.mypy.overrides]]
module = ["calibre.*", "qt.*", "mechanize.*", "css_selectors.*", "html5lib.*"]
ignore_missing_imports = true
